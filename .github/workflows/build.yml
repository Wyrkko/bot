name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0
      - run: gradle build --stacktrace
      - name: Show repo resources and jar contents
        run: |
          echo "=== src/main/resources ==="
          ls -la src/main/resources || echo "MISSING: src/main/resources"
          echo "=== jar contents ==="
          for f in build/libs/*.jar; do echo "--- $f"; unzip -l "$f" | head -40; done
      - uses: actions/upload-artifact@v4
        with:
          name: aibots-mod-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
